<!DOCTYPE html>
<html>
<head>
<title>PromoraDB</title>

<style>
body { background:#0f172a;color:#fff;font-family:sans-serif }
.container { padding:20px }
input,button { padding:10px;margin:5px;border-radius:8px;border:none }
button { background:#22c55e;cursor:pointer }
.grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px }
.card { background:#1e293b;padding:10px;border-radius:10px;text-align:center }
img { width:100%;border-radius:8px }
</style>
</head>

<body>

<div class="container">

<h2>📤 Upload Image</h2>
<input id="uid" placeholder="User ID">
<input id="pid" placeholder="Project ID">
<input type="file" id="file">
<button onclick="upload()">Upload</button>

<h2>📂 Load Project</h2>
<button onclick="load()">Load Images</button>
<button onclick="deleteProject()" style="background:red">Delete Project</button>

<div id="images" class="grid"></div>

</div>

<script>
const BASE = "https://promoradb.vercel.app";

async function upload(){
  const file = document.getElementById("file").files[0];

  const fd = new FormData();
  fd.append("uid", uid.value);
  fd.append("promptId", pid.value);
  fd.append("file", file);

  await fetch(BASE+"/api/image-store",{
    method:"POST",
    body:fd
  });

  alert("Uploaded");
}

async function load(){
  const res = await fetch(`${BASE}/api/image-serve?uid=${uid.value}&promptId=${pid.value}`);
  const data = await res.json();

  images.innerHTML="";

  data.images.forEach(img=>{
    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <img src="${img.cdnUrl}">
      <button onclick="view('${img.filename}')">View</button>
      <button onclick="del('${img.filename}')" style="background:red">Delete</button>
    `;

    images.appendChild(div);
  });
}

function view(file){
  window.open(`${BASE}/api/image-serve?uid=${uid.value}&promptId=${pid.value}&filename=${file}`);
}

async function del(file){
  await fetch(`${BASE}/api/image-delete?uid=${uid.value}&promptId=${pid.value}&filename=${file}`,{
    method:"DELETE"
  });
  load();
}

async function deleteProject(){
  await fetch(`${BASE}/api/image-delete?uid=${uid.value}&promptId=${pid.value}`,{
    method:"DELETE"
  });
  images.innerHTML="";
}
</script>

</body>
</html>
