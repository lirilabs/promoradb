<!DOCTYPE html>
<html>
<head>
<title>PromoraDB</title>
<style>
body { background:#111;color:#fff;font-family:sans-serif }
input,button { margin:5px;padding:10px;border-radius:8px }
img { width:120px;margin:10px }
</style>
</head>
<body>

<h2>Upload</h2>
<input id="uid" placeholder="uid">
<input id="pid" placeholder="promptId">
<input id="url" placeholder="image url">
<button onclick="upload()">Upload</button>

<h2>List</h2>
<button onclick="list()">Load</button>

<div id="images"></div>

<script>
const BASE = "https://promoradb.vercel.app";

async function upload(){
  const res = await fetch(BASE+"/api/image-store",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      uid:uid.value,
      promptId:pid.value,
      imageUrl:url.value
    })
  });
  alert("Uploaded");
}

async function list(){
  const res = await fetch(`${BASE}/api/image-serve?uid=${uid.value}&promptId=${pid.value}`);
  const data = await res.json();

  images.innerHTML = "";

  data.images.forEach(img=>{
    const div = document.createElement("div");

    div.innerHTML = `
      <img src="${img.cdnUrl}">
      <br>
      <button onclick="del('${img.filename}')">Delete</button>
      <hr>
    `;

    images.appendChild(div);
  });
}

async function del(file){
  await fetch(`${BASE}/api/image-delete?uid=${uid.value}&promptId=${pid.value}&filename=${file}`,{
    method:"DELETE"
  });
  list();
}
</script>

</body>
</html>
