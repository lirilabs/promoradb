<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromoraDB Dashboard</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0f172a;
  color: white;
}

header {
  background: #020617;
  padding: 15px;
  text-align: center;
  font-weight: bold;
  font-size: 18px;
}

.container {
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

.img-card {
  background: #020617;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

img {
  width: 100%;
  border-radius: 8px;
}

.delete {
  background: red;
}
</style>
</head>

<body>

<header>🚀 PromoraDB Dashboard</header>

<div class="container">

<!-- ================= UPLOAD ================= -->
<div class="card">
<h3>📤 Upload Image</h3>

<input id="uid" placeholder="User ID">
<input id="pid" placeholder="Project ID">

<input type="file" id="file" accept="image/*">

<button onclick="upload()">Upload Image</button>
</div>

<!-- ================= LOAD ================= -->
<div class="card">
<h3>📂 Project</h3>

<button onclick="load()">Load Images</button>
<button onclick="deleteProject()" class="delete">Delete Full Project</button>
</div>

<!-- ================= IMAGES ================= -->
<div class="card">
<h3>🖼 Images</h3>
<div id="images" class="grid"></div>
</div>

</div>

<script>
const BASE = "https://promoradb.vercel.app";

// ================= UPLOAD =================
async function upload() {

  const file = document.getElementById("file").files[0];

  if (!file) {
    alert("Select a file first");
    return;
  }

  const reader = new FileReader();

  reader.onload = async () => {

    const base64 = reader.result;

    const res = await fetch(BASE + "/api/image-store", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        uid: uid.value,
        promptId: pid.value,
        imageBase64: base64
      })
    });

    const data = await res.json();

    if (data.success) {
      alert("Uploaded ✅");
      load();
    } else {
      console.error(data);
      alert("Upload failed ❌");
    }
  };

  reader.readAsDataURL(file);
}

// ================= LOAD =================
async function load() {

  const res = await fetch(
    `${BASE}/api/image-serve?uid=${uid.value}&promptId=${pid.value}`
  );

  const data = await res.json();

  const container = document.getElementById("images");
  container.innerHTML = "";

  if (!data.images || data.images.length === 0) {
    container.innerHTML = "<p>No images found</p>";
    return;
  }

  data.images.forEach(img => {

    const div = document.createElement("div");
    div.className = "img-card";

    div.innerHTML = `
      <img src="${img.cdnUrl}">
      <small>${img.filename}</small>

      <button onclick="view('${img.filename}')">View</button>
      <button class="delete" onclick="del('${img.filename}')">Delete</button>
    `;

    container.appendChild(div);
  });
}

// ================= VIEW =================
function view(filename) {
  const url = `${BASE}/api/image-serve?uid=${uid.value}&promptId=${pid.value}&filename=${filename}`;
  window.open(url, "_blank");
}

// ================= DELETE IMAGE =================
async function del(filename) {
  if (!confirm("Delete this image?")) return;

  await fetch(
    `${BASE}/api/image-delete?uid=${uid.value}&promptId=${pid.value}&filename=${filename}`,
    { method: "DELETE" }
  );

  load();
}

// ================= DELETE PROJECT =================
async function deleteProject() {
  if (!confirm("Delete full project?")) return;

  await fetch(
    `${BASE}/api/image-delete?uid=${uid.value}&promptId=${pid.value}`,
    { method: "DELETE" }
  );

  document.getElementById("images").innerHTML = "";
}
</script>

</body>
</html>
